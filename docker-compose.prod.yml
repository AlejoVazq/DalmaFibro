# Producción en el VPS. Variables en .env.prod (ver README).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestiond
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: gestiond
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestiond -d gestiond"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: gestiond-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gestiond:${POSTGRES_PASSWORD}@db:5432/gestiond
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # Solo accesible desde el propio servidor: el reverse proxy (Nginx/Caddy) publica HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
