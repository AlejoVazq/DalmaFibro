services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gestiond
      POSTGRES_PASSWORD: gestiond
      POSTGRES_DB: gestiond
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata-dev:
